name: Release

# Manual trigger: Actions tab → "Run workflow" → choose the version bump.
# `prepare` bumps the version once and commits it to main; `build` then builds
# macOS (.dmg) + Windows (.msi/.exe) in parallel and attaches both to a single
# tag + GitHub Release (v<new-version> from src-tauri/tauri.conf.json).
on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Semantic version bump"
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch

permissions:
  contents: write # commit the version bump + create the tag/release

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.bump.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Bump version & commit
        id: bump
        run: |
          CURRENT=$(node -p "require('./src-tauri/tauri.conf.json').version")
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"
          case "${{ inputs.bump }}" in
            major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
            patch) PATCH=$((PATCH + 1)) ;;
          esac
          NEW="${MAJOR}.${MINOR}.${PATCH}"
          echo "Bumping $CURRENT -> $NEW (${{ inputs.bump }})"
          node -e "const fs=require('fs');const p='src-tauri/tauri.conf.json';const j=JSON.parse(fs.readFileSync(p,'utf8'));j.version='$NEW';fs.writeFileSync(p,JSON.stringify(j,null,2)+'\n')"
          npm pkg set version="$NEW"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore: release v$NEW"
          git push
          echo "version=$NEW" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    environment: SUPABASE # secrets live in this GitHub Environment (baked at compile time)
    strategy:
      fail-fast: false # one OS failing must not cancel the other
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout (bumped main)
        uses: actions/checkout@v5
        with:
          ref: main # get the version-bump commit pushed by `prepare`

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Build, tag & release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Baked into the binary at compile time (see supabase.rs read_secret).
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        with:
          tagName: v__VERSION__ # __VERSION__ ← bumped src-tauri/tauri.conf.json
          releaseName: "FoPoMoro v__VERSION__"
          # Both matrix legs target the same tag: the first creates the release
          # (setting this body), the second uploads its artifact to it.
          releaseBody: |
            Automated build.

            **macOS (.dmg)** — ad-hoc signed, not notarized. macOS blocks it on first launch:
            1. Drag **FoPoMoro.app** from the .dmg into **Applications**.
            2. Terminal: `xattr -cr /Applications/FoPoMoro.app`
            3. Open the app normally.

            **Windows (.msi / -setup.exe)** — unsigned. SmartScreen warns on first run:
            click **More info → Run anyway**.
          releaseDraft: false
          prerelease: false
